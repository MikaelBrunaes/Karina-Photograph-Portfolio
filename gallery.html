<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Karina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #000000;
    --white: #FFFFFF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    height: 100%;
    scroll-behavior: smooth;
  }

  body {
    min-height: 100%;
    background-color: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  img {
    max-width: 100%;
    display: block;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* Navigation */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px 20px;
    z-index: 100;
    background: transparent;
  }

  .nav-links {
    display: flex;
    gap: 48px;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--white);
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease, opacity 0.3s ease;
  }

  .nav-links a:hover,
  .nav-links a.active {
    border-bottom: 1px solid var(--white);
    opacity: 0.85;
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* Page Header */
  .page-header {
    text-align: center;
    padding: 160px 24px 20px;
  }

  .page-title {
    font-family: 'Viaoda Libre', serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 6vw, 4rem);
    letter-spacing: 1px;
  }

  .page-subtitle {
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    margin-top: 10px;
    opacity: 0.9;
  }

  /* Masonry Gallery */
  .masonry {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 24px 100px;
    column-count: 3;
    column-gap: 16px;
  }

  .masonry-item {
    break-inside: avoid;
    margin-bottom: 16px;
    overflow: hidden;
    background-color: #1a1a1a;
    cursor: pointer;
  }

  .masonry-item img {
    width: 100%;
    height: auto;
    filter: grayscale(100%);
    transition: transform 0.6s ease, filter 0.4s ease;
    display: block;
  }

  .masonry-item:hover img {
    transform: scale(1.04);
    filter: grayscale(70%);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 40px 20px;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.6;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  .lightbox.active {
    opacity: 1;
    visibility: visible;
  }

  .lightbox-figure {
    position: relative;
    max-width: 90vw;
    max-height: 86vh;
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .lightbox.active .lightbox-figure {
    opacity: 1;
    transform: scale(1);
  }

  .lightbox-figure img {
    max-width: 90vw;
    max-height: 86vh;
    width: auto;
    height: auto;
    filter: grayscale(100%);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }

  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 32px;
    background: none;
    border: none;
    color: var(--white);
    font-size: 2rem;
    line-height: 1;
    font-weight: 300;
    opacity: 0.85;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 1002;
  }

  .lightbox-close:hover {
    opacity: 1;
    transform: rotate(90deg);
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--white);
    font-size: 2.4rem;
    font-weight: 300;
    opacity: 0.75;
    padding: 12px 18px;
    transition: opacity 0.25s ease;
    z-index: 1001;
  }

  .lightbox-nav:hover {
    opacity: 1;
  }

  .lightbox-prev {
    left: 12px;
  }

  .lightbox-next {
    right: 12px;
  }

  .lightbox-counter {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.65;
    white-space: nowrap;
  }

  /* Scroll to Top */
  .scroll-top-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: var(--white);
    border: 1px solid var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease, background-color 0.3s ease, visibility 0.4s ease;
    z-index: 200;
    cursor: pointer;
  }

  .scroll-top-btn.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .scroll-top-btn:hover {
    background-color: var(--black);
  }

  .scroll-top-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--black);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.3s ease;
  }

  .scroll-top-btn:hover svg {
    stroke: var(--white);
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-top-btn {
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
  }

  /* Responsive */
  @media (max-width: 900px) {
    .masonry {
      column-count: 2;
    }
  }

  @media (max-width: 768px) {
    .navbar {
      padding: 20px 16px;
    }

    .nav-links {
      gap: 24px;
    }

    .nav-links a {
      font-size: 0.7rem;
      letter-spacing: 2px;
    }

    .page-header {
      padding: 130px 20px 10px;
    }

    .masonry {
      padding: 50px 16px 80px;
      column-gap: 12px;
    }

    .masonry-item {
      margin-bottom: 12px;
    }

    .lightbox-nav {
      font-size: 1.8rem;
      padding: 8px 12px;
    }

    .lightbox-close {
      top: 16px;
      right: 18px;
      font-size: 1.6rem;
    }

    .scroll-top-btn {
      bottom: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
    }
  }

  @media (max-width: 560px) {
    .masonry {
      column-count: 1;
    }
  }

  @media (max-width: 420px) {
    .nav-links {
      gap: 14px;
    }

    .nav-links a {
      font-size: 0.62rem;
      letter-spacing: 1.5px;
    }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="page-header reveal">
    <h1 class="page-title">Gallery</h1>
    <p class="page-subtitle">Moments, held still</p>
  </header>

  <section class="masonry" id="masonry">
    <!-- Images injected by JS for consistent numbering -->
  </section>

  <footer class="footer" id="contact">
    <p>&copy; 2026 Karina Photography &mdash; All Rights Reserved</p>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous photo">&#8249;</button>
    <figure class="lightbox-figure">
      <img id="lightboxImg" src="" alt="Enlarged wedding photo">
      <figcaption class="lightbox-counter" id="lightboxCounter"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8250;</button>
  </div>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
  </button>

  <script>
    const photoSizes = [
      { w: 800, h: 1000 },
      { w: 800, h: 600 },
      { w: 800, h: 900 },
      { w: 800, h: 1100 },
      { w: 800, h: 650 },
      { w: 800, h: 950 },
      { w: 800, h: 700 },
      { w: 800, h: 1050 },
      { w: 800, h: 800 },
      { w: 800, h: 620 },
      { w: 800, h: 980 },
      { w: 800, h: 720 }
    ];

    const masonry = document.getElementById('masonry');
    const photos = photoSizes.map((size, i) => ({
      src: `https://picsum.photos/seed/karina-${i + 1}/${size.w}/${size.h}`,
      alt: `Wedding photography ${i + 1}`
    }));

    photos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'masonry-item reveal';
      item.dataset.index = i;
      item.style.transitionDelay = `${(i % 3) * 0.1}s`;
      item.innerHTML = `<img src="${photo.src}" alt="${photo.alt}" loading="lazy">`;
      masonry.appendChild(item);
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.reveal').forEach((el) => revealObserver.observe(el));

    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('is-visible', window.scrollY > 400);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const closeBtn = document.getElementById('lightboxClose');
    const prevBtn = document.getElementById('lightboxPrev');
    const nextBtn = document.getElementById('lightboxNext');

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxImage();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function updateLightboxImage() {
      lightboxImg.src = photos[currentIndex].src.replace(/\/\d+\/\d+$/, '/1400/1400');
      lightboxImg.alt = photos[currentIndex].alt;
      lightboxCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      updateLightboxImage();
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % photos.length;
      updateLightboxImage();
    }

    masonry.addEventListener('click', (e) => {
      const item = e.target.closest('.masonry-item');
      if (item) openLightbox(Number(item.dataset.index));
    });

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', showPrev);
    nextBtn.addEventListener('click', showNext);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });
  </script>

</body>
</html>
