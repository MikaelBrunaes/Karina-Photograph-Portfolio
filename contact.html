<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Karina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #000000;
    --white: #FFFFFF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    height: 100%;
    scroll-behavior: smooth;
    overflow-x: hidden;
  }

  body {
    min-height: 100%;
    background-color: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* Navigation */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px 20px;
    z-index: 100;
    background: transparent;
  }

  .nav-links {
    display: flex;
    gap: 48px;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--white);
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease, opacity 0.3s ease;
  }

  .nav-links a:hover,
  .nav-links a.active {
    border-bottom: 1px solid var(--white);
    opacity: 0.85;
  }

  .nav-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--white);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    z-index: 210;
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* Page Header */
  .page-header {
    text-align: center;
    padding: 160px 24px 20px;
  }

  .page-title {
    font-family: 'Viaoda Libre', serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 6vw, 4rem);
    letter-spacing: 1px;
  }

  .page-subtitle {
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    margin-top: 10px;
    opacity: 0.9;
  }

  /* Contact Section */
  .contact-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 70px 24px 60px;
  }

  .field {
    position: relative;
    margin-bottom: 48px;
  }

  .field label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 14px;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    color: rgba(255, 255, 255, 0.8);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    padding: 6px 2px 12px;
    outline: none;
    transition: border-color 0.3s ease, color 0.3s ease;
    resize: none;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: rgba(255, 255, 255, 0.35);
    font-weight: 300;
  }

  .field input:focus,
  .field textarea:focus {
    border-bottom-color: var(--white);
    color: var(--white);
  }

  .field textarea {
    min-height: 110px;
  }

  .submit-btn {
    display: block;
    width: 100%;
    background-color: var(--white);
    color: var(--black);
    border: 1px solid var(--white);
    font-size: 0.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 18px;
    margin-top: 16px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .submit-btn:hover {
    background-color: var(--black);
    color: var(--white);
  }

  /* Thank you message */
  .thank-you {
    display: none;
    text-align: center;
    padding: 60px 24px;
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .thank-you.visible {
    display: block;
    opacity: 1;
  }

  .contact-form.hidden {
    display: none;
  }

  /* Social */
  .social {
    text-align: center;
    padding: 0 24px 100px;
  }

  .social a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 50%;
    transition: border-color 0.3s ease, opacity 0.3s ease;
    opacity: 0.85;
  }

  .social a:hover {
    border-color: var(--white);
    opacity: 1;
  }

  .social svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--white);
    stroke-width: 1.5;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 40px 20px;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.6;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* Scroll to Top */
  .scroll-top-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: var(--white);
    border: 1px solid var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease, background-color 0.3s ease, visibility 0.4s ease;
    z-index: 200;
    cursor: pointer;
  }

  .scroll-top-btn.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .scroll-top-btn:hover {
    background-color: var(--black);
  }

  .scroll-top-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: var(--black);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.3s ease;
  }

  .scroll-top-btn:hover svg {
    stroke: var(--white);
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-top-btn {
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .nav-links {
      transition: none;
    }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .navbar {
      padding: 20px 16px;
      justify-content: flex-end;
    }

    .nav-toggle {
      display: block;
    }

    .nav-links {
      position: fixed;
      inset: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      background-color: var(--black);
      transform: translateX(100%);
      opacity: 0;
      visibility: hidden;
      transition: transform 0.4s ease, opacity 0.4s ease, visibility 0.4s ease;
      z-index: 205;
    }

    .nav-links.is-open {
      transform: translateX(0);
      opacity: 1;
      visibility: visible;
    }

    .nav-links a {
      font-size: 1rem;
      letter-spacing: 3px;
    }

    .page-header {
      padding: 130px 20px 10px;
    }

    .contact-wrap {
      padding: 50px 24px 40px;
    }

    .field {
      margin-bottom: 36px;
    }

    .scroll-top-btn {
      bottom: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
    }
  }

</style>
</head>
<body>

  <nav class="navbar">
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <header class="page-header reveal">
    <h1 class="page-title">Contact</h1>
    <p class="page-subtitle">Let's talk about your day</p>
  </header>

  <section class="contact-wrap reveal">
    <form class="contact-form" id="contactForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell me about your wedding day..." required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <p class="thank-you" id="thankYou">Thank you. I'll be in touch soon.</p>
  </section>

  <div class="social reveal">
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"></circle>
      </svg>
    </a>
  </div>

  <footer class="footer" id="contact">
    <p>&copy; 2026 Karina Photography &mdash; All Rights Reserved</p>
  </footer>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
  </button>

  <script>
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');

    function closeNav() {
      navLinks.classList.remove('is-open');
      navToggle.setAttribute('aria-expanded', 'false');
      navToggle.innerHTML = '&#9776;';
      document.body.style.overflow = '';
    }

    function openNav() {
      navLinks.classList.add('is-open');
      navToggle.setAttribute('aria-expanded', 'true');
      navToggle.innerHTML = '&#10005;';
      document.body.style.overflow = 'hidden';
    }

    navToggle.addEventListener('click', () => {
      navLinks.classList.contains('is-open') ? closeNav() : openNav();
    });

    navLinks.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeNav));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeNav();
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) closeNav();
    });

    const form = document.getElementById('contactForm');
    const thankYou = document.getElementById('thankYou');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      form.classList.add('hidden');
      thankYou.classList.add('visible');
    });

    const revealEls = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

    revealEls.forEach((el) => revealObserver.observe(el));

    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('is-visible', window.scrollY > 400);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
